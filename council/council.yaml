# Model Council Configuration
# Edit this file to update model versions

models:
  claude:
    provider: anthropic
    default: claude-sonnet-4-20250514
    alternatives:
      - claude-opus-4-20250514
      - claude-haiku-4-20250514

  openai:
    provider: openai
    default: gpt-4o
    alternatives:
      - gpt-4o-mini
      - gpt-4-turbo

  gemini:
    provider: google
    default: gemini-2.0-flash
    alternatives:
      - gemini-1.5-pro-latest
      - gemini-1.5-flash

  mistral:
    provider: mistral
    default: mistral-large-latest
    alternatives:
      - mistral-medium-latest
      - mistral-small-latest

  deepseek:
    provider: deepseek
    default: deepseek-chat
    alternatives:
      - deepseek-coder

  groq:
    provider: groq
    default: llama-3.3-70b-versatile
    alternatives:
      - llama-3.1-8b-instant
      - mixtral-8x7b-32768

  ollama:
    provider: ollama
    default: llama3.2
    alternatives:
      - mistral
      - codellama

council:
  enabled_models:
    - claude
    - gemini
  approval_threshold: 0.7
