[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "model-council"
version = "0.1.0"
description = "Multi-model AI council framework for consensus-based task execution"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Karthik Raghavan"}]
keywords = ["ai", "llm", "multi-model", "ensemble", "code-review", "claude", "gemini", "mistral", "ollama"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "click>=8.0",
    "httpx>=0.25",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "anthropic>=0.40",
    "google-generativeai>=0.8",
    "mistralai>=1.0",
    "ollama>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.1",
]

[project.scripts]
council = "council.cli:main"

[project.urls]
Homepage = "https://github.com/kraghavan/model-council-applications"
Repository = "https://github.com/kraghavan/model-council-applications"

[tool.setuptools.packages.find]
where = ["."]
include = ["council*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
